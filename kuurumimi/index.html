<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check out Lanny</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  
  <link rel="icon" type="image/svg+xml" href="https://link.me/assets/6e5ded28e4b968c64c8536be59b45dc7_2318.svg">
  <link rel="apple-touch-icon" href="https://link.me/assets/6e5ded28e4b968c64c8536be59b45dc7_2318.svg">

  <link rel="stylesheet" href="style.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-EPFEE543MZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-EPFEE543MZ');
  </script>
</head>
<body>
  <header class="sticky-header" id="stickyHeader">
    <img class="sticky-header__avatar" src="images/icon1.jpg" alt="Lanny">
    <span class="sticky-header__name">
      Lanny
      <span class="sticky-header__check" aria-label="Verificado">
        <img src="https://link.me/dummy/verify/default.svg" alt="Verified" width="18" height="18">
      </span>
    </span>
  </header>
  <div class="hero" id="hero">
    <img class="hero__img" src="images/main.jpg" alt="Willow"
         onerror="this.style.display='none'">
    <div class="hero__scroll-overlay" id="heroScrollOverlay"></div>
    <div class="hero__bottom-grad"></div>
    <div class="hero__ring-avatar">
      <img src="images/icon1.jpg" alt="" onerror="this.style.display='none'">
    </div>
  </div>
  <main class="page">
    <section class="profile">
      <h1 class="profile__name">
        Lanny
        <span class="profile__verified" aria-label="Verified">
          <img src="https://link.me/dummy/verify/default.svg" alt="Verified" width="20" height="20">
        </span>
      </h1>
      <p class="profile__handle">@kuurumimi</p>
     <div class="profile__platform">
        <svg class="platform__icon" width="11" height="13" viewBox="0 0 11 16" fill="none">
          <path d="M5.5 0L0 8.5H4L1.5 16L11 6.5H6.5L9.5 0H5.5Z" fill="white"/>
        </svg>
        <span>me</span>
      </div>
      <p class="profile__bio">❤️ Enjoy :)</p>
    </section>
    <div class="connect-wrap">
      <div class="connect">
        <span class="connect__input connect__input--label">¿Buscas una comisión?</span>
        <a href="mailto:kuurumimi@gmail.com" class="connect__btn">
          Connect with
          <span class="connect__avatar">
            <img src="images/icon1.jpg" alt="" onerror="this.style.display='none'">
          </span>
        </a>
      </div>
    </div>
    <div class="links">
      <a href="t.me/kuurumimi" target="_blank" class="card card--banner">
        <img class="card__bg-img" src="images/patreon.jpeg" alt=""
             onerror="this.style.display='none'">
        <span class="card__story-ring">
          <img src="images/patreon.jpeg" alt="" onerror="this.style.display='none'">
        </span>
        <div class="card__grad"></div>
        <span class="card__label card__label--center">Let's chat 💗</span>
      </a>
      <div class="grid-row">
        <a href="https://tiktok.com/@kuurumimi" target="_blank" class="card card--grid card--tiktok-bg">
          <img class="card__bg-img" src="images/tiktok.jpg" alt=""
               onerror="this.style.display='none'">
          <div class="card__grad"></div>
          <span class="card__platform-icon">
            <i class="fa-brands fa-tiktok"></i>
          </span>
          <span class="card__label">TikTok</span>
        </a>
        <a href="https://instagram.com/lanzia21" target="_blank" class="card card--grid card--ig-bg">
          <img class="card__bg-img" src="images/instagram.jpg" alt=""
               onerror="this.style.display='none'">
          <div class="card__grad"></div>
          <span class="card__platform-icon">
            <i class="fa-brands fa-instagram"></i>
          </span>
          <span class="card__label">Instagram</span>
        </a>
      </div>
      <div class="grid-row">
        <a href="https://www.deviantart.com/kurumimi21" target="_blank" class="card card--grid card--da-bg">
          <img class="card__bg-img" src="images/deviant.jpg" alt=""
               onerror="this.style.display='none'">
          <div class="card__grad"></div>
          <span class="card__platform-icon">
            <i class="fa-brands fa-deviantart"></i>
          </span>
          <span class="card__label">DeviantArt</span>
        </a>
        <a href="https://www.threads.com/@lannyrvz" target="_blank" class="card card--grid card--th-bg">
          <img class="card__bg-img" src="images/threads.png" alt="imagen threads"
               onerror="this.style.display='none'">
          <div class="card__grad"></div>
          <span class="card__platform-icon">
            <i class="fa-brands fa-threads"></i>
          </span>
          <span class="card__label">Threads</span>
        </a>
      </div>
      <a href="https://www.amazon.com.mx/hz/wishlist/ls/O3JL515ZTUTG?ref_=wl_share" target="_blank" class="card card--wishlist">
        <span class="card__amazon-dot">
          <i class="fa-brands fa-amazon"></i>
        </span>
        My Wishlist
      </a>
    </div>
  </main>
  <footer class="page-footer">
    <div class="page-footer__terms">
      <a href="https://about.link.me/privacypolicy" target="_blank">Privacy Policy</a>
      <span class="page-footer__sep">|</span>
      <a href="https://about.link.me/termsandconditions" target="_blank">Terms</a>
      </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
